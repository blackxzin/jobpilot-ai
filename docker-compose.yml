# JobPilot AI — Local Development Stack
# Usage: docker compose up -d

services:
  postgres:
    # Semantic search stores embeddings as JSON and scores them in the app,
    # so pgvector is optional. To use real vector columns later, switch to
    # `pgvector/pgvector:pg16` — that requires a fresh postgres_data volume.
    image: postgres:16-alpine
    container_name: jobpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot_secret}
    ports:
      # Host port is configurable: 5432 is often already taken by another
      # local Postgres. Containers always talk to each other on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot_network

  redis:
    image: redis:7-alpine
    container_name: jobpilot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src:ro
      # Writable: `alembic revision --autogenerate` writes new files here, and
      # the committed revisions must stay visible to `alembic upgrade head`.
      - ./apps/backend/alembic:/app/alembic
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobpilot_network

  celery-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CELERY_WORKER=true
    working_dir: /app/src
    volumes:
      - ./apps/backend/src:/app/src:ro
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    networks:
      - jobpilot_network

  celery-beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CELERY_BEAT=true
    working_dir: /app/src
    volumes:
      - ./apps/backend/src:/app/src:ro
    command: celery -A workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    networks:
      - jobpilot_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=development
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public
      - ./apps/frontend/tailwind.config.ts:/app/tailwind.config.ts:ro
    networks:
      - jobpilot_network

volumes:
  postgres_data:
  redis_data:

networks:
  jobpilot_network:
    driver: bridge
