# JobPilot AI — Local Development Stack
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot_network

  redis:
    image: redis:7-alpine
    container_name: jobpilot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src:ro
      - ./apps/backend/alembic:/app/alembic:ro
      - alembic_data:/app/alembic/versions
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - jobpilot_network

  celery-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      - CELERY_WORKER=true
    volumes:
      - ./apps/backend/src:/app/src:ro
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    networks:
      - jobpilot_network

  celery-beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      - CELERY_BEAT=true
    volumes:
      - ./apps/backend/src:/app/src:ro
    command: celery -A workers.celery_app beat --loglevel=info
    networks:
      - jobpilot_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: development
    container_name: jobpilot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=development
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public
    networks:
      - jobpilot_network

  nginx:
    image: nginx:alpine
    container_name: jobpilot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - jobpilot_network

volumes:
  postgres_data:
  redis_data:
  alembic_data:

networks:
  jobpilot_network:
    driver: bridge
