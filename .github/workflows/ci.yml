name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobpilot_test
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot_test
        ports:
          - 5432:5432
        # Without a health gate the job can start before Postgres accepts
        # connections, producing a flaky failure on a cold runner.
        options: >-
          --health-cmd "pg_isready -U jobpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run tests with coverage
        env:
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # A real provider key was committed to `.env.example` once before. This
  # blocks the next one from reaching the default branch.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for provider API keys
        run: |
          pattern='(nvapi-[A-Za-z0-9_-]{40}|sk-proj-[A-Za-z0-9_-]{20}|sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20}|AIzaSy[A-Za-z0-9_-]{30}|re_[A-Za-z0-9]{24})'
          if git grep -nIE "$pattern" -- . ; then
            echo "::error::A provider API key is committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No provider API keys in tracked files."
