name: Deploy demo

# Publishes the browser-only demo to GitHub Pages. It is the real frontend
# with the API answered in-browser from fixtures captured off a running
# instance, so the published page needs no server, no database and no keys.

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running publish half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Build static demo
        env:
          # Pages serves the site from /<repository>, so assets need that prefix.
          STATIC_DEMO_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:demo

      - name: Mark the output as not-Jekyll
        # The Actions publishing flow does not run Jekyll, but this keeps the
        # _next directory intact if the repository is ever switched back to
        # branch-based Pages, where Jekyll would skip underscore-prefixed paths.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
