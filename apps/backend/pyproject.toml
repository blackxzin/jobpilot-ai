[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "JobPilot AI - Intelligent Career Copilot Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "celery>=5.4.0",
    # "better-auth>=0.0.1",  # npm package, not PyPI
    "openai>=1.40.0",
    "anthropic>=0.27.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI dependencies are declared as call defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
