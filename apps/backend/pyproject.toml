[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "JobPilot AI - Intelligent Career Copilot Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "celery>=5.4.0",
    "better-auth>=0.0.1",
    "openai>=1.40.0",
    "anthropic>=0.27.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
